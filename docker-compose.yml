services:
  n8n:
    image: n8nio/n8n:2.46.7
    container_name: noavia_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Berlin}
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./knowledge:/home/node/.n8n-files/support-kb:ro
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: noavia_qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
